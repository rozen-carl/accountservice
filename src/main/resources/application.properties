server.port=8081
spring.application.name=accountservice
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.datasource.url=${DB_URL_CUSTOMER_SERVICE}
spring.datasource.username=${DB_USERNAME_CUSTOMER_SERVICE}
spring.datasource.password=${DB_PASSWORD_ACCOUNT_SERVICE}

#Client Urls
customer-service.url==${CUSTOMER_SERVICE_URL}

spring.flyway.enabled=true